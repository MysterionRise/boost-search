name: Modern RAG CI

on:
  push:
    branches: [ main, develop, "claude/**" ]
    paths:
      - 'modern-rag/**'
      - '.github/workflows/modern-rag-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'modern-rag/**'

env:
  PYTHON_VERSION: '3.11'

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    defaults:
      run:
        working-directory: ./modern-rag

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            modern-rag/requirements-lock.txt
            modern-rag/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        env:
          OPENAI_API_KEY: test-key
          QDRANT_HOST: localhost
        run: |
          pytest tests/unit -v --cov=src --cov-report=xml --cov-report=term-missing -m "unit and not requires_api_key"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./modern-rag/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./modern-rag

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black ruff mypy

      - name: Check formatting with Black
        run: |
          black --check --diff src/ tests/ examples/ api/

      - name: Lint with Ruff
        run: |
          ruff check src/ tests/ examples/ api/

      - name: Type check with mypy
        run: |
          mypy src/ --install-types --non-interactive || true

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./modern-rag

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "curl -f http://localhost:6333/health || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -r requirements-dev.txt

      - name: Wait for Qdrant
        run: |
          echo "Waiting for Qdrant to be ready..."
          for i in {1..30}; do
            if curl -f http://localhost:6333/health 2>/dev/null; then
              echo "Qdrant is ready!"
              exit 0
            fi
            echo "Attempt $i/30: Qdrant not ready yet, waiting..."
            sleep 1
          done
          echo "ERROR: Qdrant failed to become ready after 30 seconds"
          exit 1

      - name: Verify Qdrant connection
        run: |
          echo "Testing Qdrant API endpoints..."
          curl -v http://localhost:6333/health
          curl -v http://localhost:6333/collections

      - name: Run integration tests
        env:
          OPENAI_API_KEY: test-key
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
        run: |
          pytest tests/integration -v -m "integration and not requires_api_key" --timeout=60

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./modern-rag

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t modern-rag:test .

      - name: Test Docker Compose
        run: |
          docker-compose config
          echo "Docker Compose configuration is valid"

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./modern-rag

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Check dependencies for vulnerabilities
        run: |
          pip install -r requirements.txt
          safety check --json || true

      - name: Run Bandit security linter
        run: |
          bandit -r src/ -f json || true

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: ./modern-rag

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -r requirements-dev.txt

      - name: Generate coverage report
        env:
          OPENAI_API_KEY: test-key
        run: |
          pytest tests/unit -v --cov=src --cov-report=html --cov-report=term -m "unit and not requires_api_key"

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: modern-rag/htmlcov/
